<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Portal</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    padding:25px;
    text-align:center;
    background:#111827;
    border-bottom:2px solid #334155;
}

h1{ margin:0; }

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    <div class="card">
  <h2>الفريق</h2>
  <div id="team">جاري التحميل...</div>
</div>
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.status{
    font-size:20px;
    color:#22c55e;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:15px;
    color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🎻 SOS Portal</h1>
<p>لوحة التحكم الحية للمشروع</p>
</header>

<div class="container">

<!-- الحالة -->
<div class="grid">

<div class="card">
<h2>الحالة</h2>
<div id="status">جاري التحميل...</div>
<p>اللفة الحالية: <span id="loop">...</span></p>
</div>

<div class="card">
<h2>المساهمات</h2>
<div id="contributors">جاري التحميل...</div>
</div>

</div>

</div>

<footer>
SOS v1.0 - Live Memory System
</footer>

<script>
async function loadMemory() {
    const statusEl = document.getElementById("status");
    const loopEl = document.getElementById("loop");
    const teamEl = document.getElementById("team");
    const contribEl = document.getElementById("contributors");

    try {
        console.log("تحميل memory_core.json...");

        const response = await fetch("./memory_core.json?v=" + Date.now());

        console.log("Status:", response.status);

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const data = await response.json();
        console.log("DATA LOADED:", data);

        // الحالة
        statusEl.innerText = data.status || "غير متوفر";
        loopEl.innerText = data.current_loop || "...";

        // الفريق
        teamEl.innerHTML = "";
        if (data.team?.members) {
            Object.entries(data.team.members).forEach(([name, state]) => {
                const div = document.createElement("div");
                div.innerHTML = `<strong>${name}</strong> — ${state}`;
                teamEl.appendChild(div);
            });
        }

        // المساهمات
        contribEl.innerHTML = "";
        if (data.contributions) {
            Object.entries(data.contributions).forEach(([name, c]) => {
                const div = document.createElement("div");
                div.innerHTML = `<strong>${name}</strong><br><small>${c.Summary || ""}</small>`;
                contribEl.appendChild(div);
            });
        }

    } catch (err) {
        console.error("LOAD ERROR:", err);
        statusEl.innerText = "فشل تحميل memory_core.json";
    }
}

loadMemory();
</script>

</body>
</html>
