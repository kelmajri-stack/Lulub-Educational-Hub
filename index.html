<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Portal</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    padding:25px;
    text-align:center;
    background:#111827;
    border-bottom:2px solid #334155;
}

h1{ margin:0; }

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.status{
    font-size:20px;
    color:#22c55e;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:15px;
    color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🎻 SOS Portal</h1>
<p>لوحة التحكم الحية للمشروع</p>
</header>

<div class="container">

<!-- الحالة -->
<div class="grid">

<div class="card">
<h2>الحالة</h2>
<div id="status">جاري التحميل...</div>
<p>اللفة الحالية: <span id="loop">...</span></p>
</div>

<div class="card">
<h2>المساهمات</h2>
<div id="contributors">جاري التحميل...</div>
</div>

</div>

</div>

<footer>
SOS v1.0 - Live Memory System
</footer>

<script>
async function loadMemory() {
    try {
        const res = await fetch("memory_core.json");
        const data = await res.json();

        // الحالة
        document.getElementById("status").innerText = data.status;
        document.getElementById("loop").innerText = data.current_loop;

        // المساهمات
        const container = document.getElementById("contributors");
        container.innerHTML = "";

        Object.keys(data.contributions).forEach(name => {
            const c = data.contributions[name];

            const div = document.createElement("div");
            div.style.marginBottom = "10px";
            div.style.padding = "10px";
            div.style.background = "#0f172a";
            div.style.borderRadius = "8px";

            div.innerHTML = `
                <strong>${name}</strong><br>
                <small>${c.Summary}</small>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        document.getElementById("status").innerText = "خطأ في تحميل الذاكرة";
        console.error(err);
    }
}

loadMemory();
</script>

</body>
</html>
