<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Portal</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    padding:25px;
    text-align:center;
    background:#111827;
    border-bottom:2px solid #334155;
}

h1{ margin:0; }

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    <div class="card">
  <h2>الفريق</h2>
  <div id="team">جاري التحميل...</div>
</div>
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.status{
    font-size:20px;
    color:#22c55e;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:15px;
    color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🎻 SOS Portal</h1>
<p>لوحة التحكم الحية للمشروع</p>
</header>

<div class="container">

<!-- الحالة -->
<div class="grid">

<div class="card">
<h2>الحالة</h2>
<div id="status">جاري التحميل...</div>
<p>اللفة الحالية: <span id="loop">...</span></p>
</div>

<div class="card">
<h2>المساهمات</h2>
<div id="contributors">جاري التحميل...</div>
</div>

</div>

</div>

<footer>
SOS v1.0 - Live Memory System
</footer>

<script>
async function loadMemory() {
    try {
        const response = await fetch("./memory_core.json?v=" + new Date().getTime());
        const data = await response.json();

        document.getElementById("status").innerText = data.status || "غير متوفر";
        document.getElementById("loop").innerText = data.current_loop || "؟";

        const container = document.getElementById("contributors");
        container.innerHTML = "";

        if (!data.contributions) return;

        Object.entries(data.contributions).forEach(([name, c]) => {
            const div = document.createElement("div");

            div.style.margin = "10px 0";
            div.style.padding = "10px";
            div.style.background = "#0f172a";
            div.style.borderRadius = "8px";
            div.style.border = "1px solid #334155";

            div.innerHTML = `
                <strong>${name}</strong><br>
                <small>${c?.Summary || ""}</small>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "خطأ في تحميل البيانات";
    }
}

loadMemory(const teamContainer = document.getElementById("team");
teamContainer.innerHTML = "";

if (data.team && data.team.members) {
    Object.entries(data.team.members).forEach(([name, status]) => {

        const div = document.createElement("div");

        div.style.margin = "6px 0";
        div.style.padding = "8px";
        div.style.borderRadius = "6px";
        div.style.background = "#0f172a";

        div.innerHTML = `
            <strong>${name}</strong> — 
            <span style="color:#22c55e">${status}</span>
        `;

        teamContainer.appendChild(div);
    });
});
</script>

</body>
</html>
